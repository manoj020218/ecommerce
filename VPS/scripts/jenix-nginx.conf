# ── Storefront: jenixindia.com + www (LIVE, SSL) ──────────────────────────────
server {
  server_name jenixindia.com www.jenixindia.com;
  root /root/projects/jenixindia/VPS/apps/front/dist;
  index index.html;

  # 301 redirects for old product URLs (133 rules from Phase 4 migration)
  include /etc/nginx/snippets/jenix-product-redirects.conf;

  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:4100/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location ~ ^/sitemaps/(.+\.xml)$ {
    proxy_pass http://127.0.0.1:4100/sitemaps/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location = /robots.txt {
    proxy_pass http://127.0.0.1:4100/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location = /feed/google.xml {
    proxy_pass http://127.0.0.1:4100/feed/google.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location = /feed/facebook.xml {
    proxy_pass http://127.0.0.1:4100/feed/facebook.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/jenixindia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jenixindia.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Admin Panel ───────────────────────────────────────────────────────────────
server {
  server_name admin.jenixindia.com;
  root /root/projects/jenixindia/VPS/apps/admin-panel/dist;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/jenixindia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jenixindia.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── API ───────────────────────────────────────────────────────────────────────
server {
  server_name api.jenixindia.com;
  location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/jenixindia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jenixindia.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name jenixindia.com www.jenixindia.com admin.jenixindia.com api.jenixindia.com;
  return 301 https://$host$request_uri;
}

# ── Commerce Watchdog API ─────────────────────────────────────────────────────
server {
  server_name watchdog-api.iotsoft.in;
  location / {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/watchdog-api.iotsoft.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/watchdog-api.iotsoft.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
  if ($host = watchdog-api.iotsoft.in) { return 301 https://$host$request_uri; }
  server_name watchdog-api.iotsoft.in;
  listen 80;
  return 404;
}
